[package]
name = "anchor"
version = "0.0.1"
edition = "2024"
description = "Modern 2D Game Framework"
authors = ["Tudor-Cristian Lechințan <lechintantudor02@gmail.com>"]
repository = "https://github.com/LechintanTudor/anchor"
keywords = ["gamedev"]
categories = ["game-development"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["shape-builder"]
shape-builder = ["lyon"]

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
glyph_brush = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
ordered-float = "5.1"
pollster = "0.4"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
wgpu = "28.0"
winit = "0.30"

# Optional dependencies
lyon = { version = "1.0", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast-possible-truncation = "allow"
cast-precision-loss = "allow"
collapsible-if = "allow"
missing-errors-doc = "allow"
missing-fields-in-debug = "allow"
missing-panics-doc = "allow"
pub-underscore-fields = "allow"
too-many-lines = "allow"
